<!DOCTYPE html>
<html>
<head>
  <title>Boy_yuskid's Orange Dynasty Space Calendar</title>
  <style>
    body {
      background-color: orange;
      font-family: Arial, sans-serif;
      margin: 20px;
    }
    h1 {
      text-align: center;
      color: white;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      background-color: #fff3e0;
    }
    th, td {
      border: 2px solid darkorange;
      padding: 10px;
      text-align: center;
    }
    th {
      background-color: darkorange;
      color: white;
    }
    td[contenteditable="true"] {
      background-color: #ffffff;
    }
    .btn {
      margin: 10px 5px;
      padding: 10px 20px;
      background-color: darkorange;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }
    .btn:hover {
      background-color: orangered;
    }
  </style>
</head>
<body>

<h1>Boy_yuskid's Orange Dynasty Space Calendar</h1>

<table id="calendarTable">
  <thead>
    <tr>
      <th>Topic</th>
      <th>Host</th>
      <th>Time</th>
      <th>Day</th>
      <th>Re-occurring</th>
    </tr>
  </thead>
  <tbody id="tableBody">
    <!-- Rows will be added by JavaScript -->
  </tbody>
</table>

<div style="text-align:center;">
  <button class="btn" onclick="addRow()">+ Add More</button>
  <button class="btn" onclick="saveCalendar()">💾 Save</button>
</div>

<script>
  function addRow(data = ["", "", "", "", ""]) {
    const table = document.getElementById("tableBody");
    const row = document.createElement("tr");
    data.forEach(text => {
      const cell = document.createElement("td");
      cell.contentEditable = true;
      cell.innerText = text;
      row.appendChild(cell);
    });
    table.appendChild(row);
  }

  function loadCalendar() {
    const saved = JSON.parse(localStorage.getItem('calendarData')) || [];
    const tableBody = document.getElementById('tableBody');

    tableBody.innerHTML = ''; // Clear existing
    if (saved.length > 0) {
      saved.forEach(rowData => addRow(rowData));
    } else {
      for (let i = 0; i < 10; i++) addRow();
    }
  }

  function saveCalendar() {
    const table = document.getElementById("calendarTable");
    const data = [];
    for (let i = 1; i < table.rows.length; i++) {
      const row = table.rows[i];
      const rowData = [];
      for (let j = 0; j < row.cells.length; j++) {
        rowData.push(row.cells[j].innerText.trim());
      }
      data.push(rowData);
    }
    localStorage.setItem("calendarData", JSON.stringify(data));
    alert("✅ Calendar saved successfully!");
  }

  window.onload = loadCalendar;
</script>

</body>
</html>
