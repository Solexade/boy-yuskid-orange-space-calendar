<button class="save-button" onclick="saveCalendar()">Save Calendar</button>

<script>
  function saveCalendar() {
    let table = document.getElementById("calendarTable");
    let text = "";

    for (let i = 0; i < table.rows.length; i++) {
      let cells = table.rows[i].cells;
      for (let j = 0; j < cells.length; j++) {
        text += cells[j].innerText.trim() + (j < cells.length - 1 ? " | " : "");
      }
      text += "\n";
    }

    let blob = new Blob([text], { type: "text/plain;charset=utf-8" });
    let link = document.createElement("a");
    link.href = URL.createObjectURL(blob);
    link.download = "Boy_Yuskid_Orange_Dynasty_Calendar.txt";
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
  }
</script>
